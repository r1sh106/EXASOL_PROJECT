<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#0b6a88">
<title>{% block title %}KNODE{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<nav class="k-nav">
  <div class="container py-2 d-flex align-items-center justify-content-between gap-2">
    <a class="d-flex align-items-center gap-2 text-decoration-none" href="{% block brand_href %}{{ url_for('home') }}{% endblock %}">
      <span class="k-logo">K</span>
      <span class="fw-bold" style="color:var(--k-ink)">{% block brand %}KNODE{% endblock %}</span>
    </a>
    <div class="d-flex align-items-center gap-2">{% block nav %}{% endblock %}</div>
  </div>
</nav>
<main class="container py-3 py-md-4">
{% block content %}{% endblock %}
</main>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="toast" class="toast align-items-center border-0" role="status" aria-live="polite">
    <div class="d-flex"><div class="toast-body fw-semibold" id="toastBody"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function toast(msg, bad){
    const el = document.getElementById('toast');
    el.style.background = bad ? 'var(--k-bad)' : 'var(--k-ink)'; el.style.color = 'var(--k-surface)';
    document.getElementById('toastBody').textContent = msg;
    bootstrap.Toast.getOrCreateInstance(el, {delay: 3500}).show();
  }
  async function postJSON(url, body){
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
    const j = await r.json().catch(() => ({ok:false, message:'Something went wrong on the server.'}));
    if (!r.ok || j.ok === false) { toast(j.message || 'Something went wrong.', true); throw new Error(j.message); }
    return j;
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
